          cd /w && ls -l /dev/kvm /dev/vhost-vsock 2>&1
          echo "=== weft doctor (con KVM: debe terminar con 0)"
          /pkg/weft/weft doctor > /sal/doctor-ventanas.txt 2>&1; echo "doctor codigo=$?" >> /sal/doctor-ventanas.txt; cat /sal/doctor-ventanas.txt
          echo "=== guion del usuario, sin ventana, dibujo por software"
          WEFT_DIR=/pkg/weft WEFT_GPU=virtio-pci WEFT_DISPLAY=none WEFT_AUDIO=none WEFT_WAIT=300 bash /src/scripts/dev-fedora.sh; echo "codigo=$?"
          cp weft-data/screenshot.png /sal/captura-software.png 2>/dev/null; WEFT_DIR=/pkg/weft bash /src/scripts/dev-fedora.sh parar
          echo "=== guion del usuario, ventana GTK sobre Wayland (weston sin pantalla), dibujo por software"
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
          weston --backend=headless --socket=wl-prueba > /sal/weston.txt 2>&1 & sleep 4
          WAYLAND_DISPLAY=wl-prueba GDK_BACKEND=wayland WEFT_DIR=/pkg/weft WEFT_GPU=virtio-pci WEFT_DISPLAY=gtk WEFT_AUDIO=none WEFT_WAIT=300 bash /src/scripts/dev-fedora.sh; echo "codigo=$?"
          cp weft-data/screenshot.png /sal/captura-gtk.png 2>/dev/null; WEFT_DIR=/pkg/weft bash /src/scripts/dev-fedora.sh parar
          echo "=== guion del usuario, gfxstream (Vulkan por software de Fedora), ventana GTK"
          WAYLAND_DISPLAY=wl-prueba GDK_BACKEND=wayland WEFT_DIR=/pkg/weft WEFT_DISPLAY=gtk WEFT_AUDIO=none WEFT_WAIT=200 bash /src/scripts/dev-fedora.sh; echo "codigo=$?"
          cp weft-data/screenshot.png /sal/captura-gfxstream.png 2>/dev/null; WEFT_DIR=/pkg/weft bash /src/scripts/dev-fedora.sh parar
          tail -c 3000 weft-data/state/prueba/qemu.log > /sal/qemu-gfxstream.txt 2>/dev/null
          echo "=== guion del usuario, gfxstream, ventana SDL"
          WAYLAND_DISPLAY=wl-prueba SDL_VIDEODRIVER=wayland WEFT_DIR=/pkg/weft WEFT_DISPLAY=sdl WEFT_AUDIO=none WEFT_WAIT=200 bash /src/scripts/dev-fedora.sh; echo "codigo=$?"
          cp weft-data/screenshot.png /sal/captura-gfxstream-sdl.png 2>/dev/null; WEFT_DIR=/pkg/weft bash /src/scripts/dev-fedora.sh parar
          tail -c 1500 weft-data/state/prueba/qemu.log > /sal/qemu-sdl.txt 2>/dev/null
        ' > res/ventanas.txt 2>&1
        echo "resultado=$?" | tee -a res/ventanas.txt
        sudo cp sal/*.png sal/*.txt res/ 2>/dev/null; sudo chown -R "$USER" res
        grep -E "^=== guion|^gpu=|arranque_completo|^captura [0-9]|motor grafico|codigo=|ERROR" res/ventanas.txt
        # las cuatro variantes deben arrancar, todas (tambien las de ventana GTK) con la resolucion pedida y, con gfxstream,
        # con el motor del anfitrion; weft doctor con KVM termina con 0 (en un solo && para que cuente todo, no solo
        # la ultima orden: este paso no corre con -e)
        test "$(grep -c "arranque_completo=si" res/ventanas.txt)" -eq 4 && test "$(grep -c "^captura 720x1348" res/ventanas.txt)" -eq 4 && test "$(grep -c "motor grafico: Virtio-GPU GFXStream" res/ventanas.txt)" -eq 2 && grep -q "^doctor codigo=0" res/ventanas.txt
    - name: Guardar resultados
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: res-ventanas
        path: res/
        if-no-files-found: ignore
        retention-days: 3
