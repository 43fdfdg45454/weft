# Unico pipeline: las tareas corren en paralelo y la ultima junta los resultados y publica la version.
name: ci
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      heddle_ref:
        description: 'Rama, etiqueta o commit de 43fdfdg45454/heddle que se compila y prueba en Android (vacio: la ultima release)'
        required: false
        default: ''
# Permisos minimos: el token solo lee el repositorio; las tareas resultados y version (las unicas que publican releases) piden
# contents: write ellas mismas. Los checkout no guardan el token en .git/config (persist-credentials: false), salvo el de version,
# que consulta las etiquetas del remoto.
permissions:
  contents: read
# Dos pushes seguidos no corren a la vez (semver calcularia la misma version dos veces y resultados pisaria el release ci del otro):
# el segundo espera a que termine el primero, sin cancelarlo a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
env:
  # commits de gfxstream y rutabaga_gfx que compilan qemu-ubuntu (via ci/build-qemu.sh, que los recibe por el entorno) y
  # bibliotecas-fedora: DEBEN coincidir con los del manifiesto flatpak/plantillas/app.yml.in (el paquete Flatpak compila los mismos)
  GFXSTREAM_REF: 07ee40efb0e7037a9a9b7fe59071e7c4997e7cbe
  RUTABAGA_REF: ced6af5b1135173c269a037e06213e8a263de271
jobs:
  # semver: la version de este pipeline la calcula GitVersion (GitVersion.yml) a partir de las etiquetas vX.Y.Z y la historia.
  # base (el binario) y flatpak la incrustan (WEFT_VERSION); version la publica como etiqueta vX.Y.Z.
  semver:
    name: version (GitVersion)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gv.outputs.semVer }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        versionSpec: '6.8.2'
    - id: gv
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
    - run: 'echo "Version: ${{ steps.gv.outputs.semVer }} (${{ steps.gv.outputs.fullSemVer }})"'
  base:
    name: unitarias y maquina minima
    needs: semver
    runs-on: ubuntu-24.04
    outputs:
      kvm: ${{ steps.kvm.outputs.kvm }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Compilar y pruebas unitarias
      env:
        WEFT_VERSION: ${{ needs.semver.outputs.version }}
      run: |
        cargo build --release
        cargo test --release
        # bucles que nunca iteran: error. El resto de avisos de clippy aun no son errores (hay muchos en la ventana)
        cargo clippy --release --all-targets -- -D clippy::never_loop
    - name: QEMU, KVM e invitado de prueba
      id: kvm
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-system-x86 busybox-static cpio
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sleep 1
        # sin KVM (ejecutor sin virtualizacion anidada) no se falla aqui: se omite la prueba con KVM y se avisa
        if [ -e /dev/kvm ]; then echo "kvm=si" >> "$GITHUB_OUTPUT"; else echo "kvm=no" >> "$GITHUB_OUTPUT"; echo "::warning title=Sin KVM::este ejecutor no tiene /dev/kvm: se omiten las pruebas que lo necesitan y la version no se publica"; fi
        ls -l /dev/kvm || true
        mkdir -p ci/out
        sudo cp "/boot/vmlinuz-$(uname -r)" ci/out/vmlinuz
        sudo chmod 644 ci/out/vmlinuz
        ci/make-guest.sh "$(command -v busybox)" ci/out/guest.cpio.gz
        qemu-system-x86_64 --version | head -n1
    - name: Prueba de extremo a extremo (KVM)
      if: steps.kvm.outputs.kvm == 'si'
      run: |
        set -o pipefail
        mkdir -p res
        WEFT_E2E=1 WEFT_ACCEL=kvm WEFT_KEEP="$PWD/res/pantalla-kvm.png" WEFT_KERNEL="$PWD/ci/out/vmlinuz" WEFT_INITRD="$PWD/ci/out/guest.cpio.gz" \
          cargo test --release --test e2e -- --nocapture 2>&1 | tee res/e2e-kvm.txt
    - name: Prueba de extremo a extremo (sin aceleracion)
      run: |
        set -o pipefail
        WEFT_E2E=1 WEFT_ACCEL=tcg WEFT_KERNEL="$PWD/ci/out/vmlinuz" WEFT_INITRD="$PWD/ci/out/guest.cpio.gz" \
          cargo test --release --test e2e -- --nocapture 2>&1 | tee res/e2e-tcg.txt
    - name: Guardar resultados
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: res-base
        path: res/
        if-no-files-found: ignore
        retention-days: 3
    - name: Guardar el ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: binario
        path: target/release/weft
        retention-days: 3
  qemu-ubuntu:
    # El QEMU con gfxstream que usa la tarea cuttlefish (Ubuntu no trae virtio-gpu-rutabaga). Se compila aqui, con ci/build-qemu.sh, y se
    # guarda en la cache de Actions (clave = el guion, la version de QEMU y los commits de gfxstream y rutabaga): despues del primer
    # pipeline casi no cuesta nada. Este
    # repositorio no depende de ninguna release de otro repositorio para esto.
    name: QEMU con gfxstream para Ubuntu (compilado o de la cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QEMU_REF: v10.0.2
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Cache del QEMU ya compilado
      id: cache
      uses: actions/cache@v4
      with:
        path: paquete
        key: qemu-gfxstream-${{ env.QEMU_REF }}-${{ env.GFXSTREAM_REF }}-${{ env.RUTABAGA_REF }}-${{ hashFiles('ci/build-qemu.sh') }}
    - name: Compilar
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash {0}
      run: |
        mkdir -p res
        ci/build-qemu.sh "$QEMU_REF" "$PWD/paquete" > res/compilacion.txt 2>&1
        echo "resultado=$?" | tee -a res/compilacion.txt
        tail -n 60 res/compilacion.txt
        grep -E "^(=== |FALLO|resultado)" res/compilacion.txt > res/resumen.txt
        test -x paquete/bin/qemu-system-x86_64
    - name: Comprobar el binario
      shell: bash {0}
      run: |
        mkdir -p res
        # con la cache no pasa por build-qemu.sh (que instala los -dev): se instalan las bibliotecas de ejecucion del QEMU propio
        sudo apt-get update -qq
        sudo apt-get install -y -qq libpulse0 libsdl2-2.0-0 libslirp0 libegl1 libgl1 libvulkan1 libgtk-3-0 libvte-2.91-0 libepoxy0 libpipewire-0.3-0 libusb-1.0-0 libfdt1 libaio1t64 libcap-ng0 libseccomp2 libsndio7.0 2>&1 | tail -n 2
        {
          LD_LIBRARY_PATH="$PWD/paquete/lib" paquete/bin/qemu-system-x86_64 --version | head -n1
          echo "rutabaga:"; LD_LIBRARY_PATH="$PWD/paquete/lib" paquete/bin/qemu-system-x86_64 -device help 2>&1 | grep -i rutabaga
          echo "bibliotecas que faltan:"; LD_LIBRARY_PATH="$PWD/paquete/lib" ldd paquete/bin/qemu-system-x86_64 | grep -i "not found"
          du -sh paquete
        } 2>&1 | tee res/binario.txt
        LD_LIBRARY_PATH="$PWD/paquete/lib" paquete/bin/qemu-system-x86_64 -device help 2>&1 | grep -qi rutabaga
    - name: Empaquetar (un .tar.gz conserva los enlaces simbolicos)
      run: tar -czf qemu-propio.tar.gz -C paquete . && ls -l qemu-propio.tar.gz
    - name: Guardar resultados
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: res-qemu
        path: res/
        if-no-files-found: ignore
        retention-days: 3
    - name: Guardar el QEMU
      uses: actions/upload-artifact@v4
      with:
        name: qemu-propio
        path: qemu-propio.tar.gz
        retention-days: 3
  cuttlefish:
    name: Android completo en Ubuntu (gfxstream, heddle, app de prueba)
    needs: qemu-ubuntu
    runs-on: ubuntu-24.04
    outputs:
      kvm: ${{ steps.kvm.outputs.kvm }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: QEMU con gfxstream (de la tarea qemu-ubuntu)
      uses: actions/download-artifact@v4
      with:
        name: qemu-propio
        path: qemu-dl
    - name: KVM, vsock y herramientas
      id: kvm
      shell: bash {0}
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
        sudo modprobe vgem; sudo chmod 666 /dev/dri/* 2>/dev/null; ls -l /dev/dri/ 2>&1
        sudo modprobe vhost_vsock; sudo chmod 666 /dev/vhost-vsock; ls -l /dev/kvm /dev/vhost-vsock
        if [ -e /dev/kvm ]; then echo "kvm=si" >> "$GITHUB_OUTPUT"; else echo "kvm=no" >> "$GITHUB_OUTPUT"; echo "::warning title=Sin KVM::este ejecutor no tiene /dev/kvm: se omiten las pruebas que lo necesitan y la version no se publica"; fi
        sudo curl -fsSL https://us-apt.pkg.dev/doc/repo-signing-key.gpg -o /etc/apt/trusted.gpg.d/artifact-registry.asc
        echo "deb https://us-apt.pkg.dev/projects/android-cuttlefish-artifacts android-cuttlefish main" | sudo tee /etc/apt/sources.list.d/cuttlefish.list
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-system-x86 virtiofsd libpulse0 libsdl2-2.0-0 libslirp0 libegl1 libgl1 libvulkan1 mesa-vulkan-drivers libgtk-3-0 libvte-2.91-0 libepoxy0 libpipewire-0.3-0 libusb-1.0-0 libfdt1 libaio1t64 libcap-ng0 libseccomp2 libsndio7.0 cuttlefish-base 2>&1 | tail -n 2
        qemu-system-x86_64 --version | head -n1; ls -l /usr/libexec/virtiofsd /dev/udmabuf 2>&1
        # weft usa su propio adb (vsock): esta tarea no instala ni pone en el PATH el adb de Google
        echo "adb instalado por paquetes: $(dpkg -l 2>/dev/null | grep -c -E '^ii +(adb|android-tools-adb|android-sdk-platform-tools)')"; command -v adb || echo "adb: no esta en el PATH"
    - name: Descarga de la imagen de Google
      shell: bash {0}
      run: |
        mkdir -p cf res
        # compilacion fija de la imagen (16373615, la misma que baja scripts/dev-fedora.sh por defecto): la prueba no cambia sola
        # cuando Google publique otra "latest"
        cvd fetch --default_build=16373615/aosp_cf_x86_64_only_phone-userdebug --target_directory="$PWD/cf" 2>&1 | tail -n 3 | cut -c1-200
    - name: Traductor ARM (heddle) y banco de pruebas (x86_64 y arm64)
      shell: bash {0}
      env:
        HEDDLE_REF: ${{ github.event.inputs.heddle_ref }}
      run: |
        mkdir -p arm res
        {
          if [ -n "$HEDDLE_REF" ]; then
            # lanzado a mano con heddle_ref: se compila esa version de heddle (como su propio CI: biblioteca guest y
            # biblioteca para x86_64 Android) para probarla en este Android antes de publicarla
            ci/build-heddle.sh "$HEDDLE_REF" arm/libheddle.so; echo "heddle $HEDDLE_REF compilado -> $?"
          else
            # la ultima release de heddle (cada push a su main que pasa su CI publica una): asi se prueba en Android lo ultimo
            # publicado. La version exacta queda en el registro (y en logcat: "libheddle.so cargada (... heddle=vX.Y.Z")
            echo "heddle: $(curl -fsSI https://github.com/43fdfdg45454/heddle/releases/latest | sed -n 's|^location: .*/tag/\(.*\)\r$|\1|ip')"
            curl -fsSL -o arm/heddle.tar.gz https://github.com/43fdfdg45454/heddle/releases/latest/download/heddle-android-x86_64.tar.gz; echo "descarga heddle (ultima release) -> $?"
            tar -xzf arm/heddle.tar.gz -C arm; cp "$(find arm -name libheddle.so | head -n1)" arm/libheddle.so
          fi
          ci/build-apk.sh x86_64 arm/banco-x86_64.apk; echo "apk x86_64 -> $?"
          ci/build-apk.sh arm64 arm/banco-arm64.apk; echo "apk arm64 -> $?"
          ls -l arm/
          echo "--- QEMU del sistema: rutabaga"; qemu-system-x86_64 -device help 2>&1 | grep -i -c rutabaga
          echo "--- QEMU del paquete de Google: rutabaga"; G=cf/bin/x86_64-linux-gnu/qemu/qemu-system-x86_64; ldd $G | grep -i "not found"; $G -L cf/usr/share/qemu/x86_64-linux-gnu -device help 2>&1 | grep -i rutabaga
          echo "--- Vulkan por software disponible"; find cf /usr/share/vulkan -name '*lavapipe*' -o -name '*lvp*' -o -name '*swiftshader*icd*' 2>/dev/null | head
        } 2>&1 | tee res/herramientas.txt
        {
          echo "--- QEMU propio con gfxstream (compilado por la tarea qemu-ubuntu de este mismo pipeline)"
          mkdir -p qemu-propio && tar -xzf qemu-dl/qemu-propio.tar.gz -C qemu-propio
          [ -e qemu-propio/lib/librutabaga_gfx_ffi.so.0 ] || ln -s librutabaga_gfx_ffi.so qemu-propio/lib/librutabaga_gfx_ffi.so.0
          LD_LIBRARY_PATH="$PWD/qemu-propio/lib" ldd qemu-propio/bin/qemu-system-x86_64 | grep -i "not found"
          LD_LIBRARY_PATH="$PWD/qemu-propio/lib" qemu-propio/bin/qemu-system-x86_64 --version | head -n1
          LD_LIBRARY_PATH="$PWD/qemu-propio/lib" qemu-propio/bin/qemu-system-x86_64 -device help 2>&1 | grep -i rutabaga
          echo "--- dispositivos de entrada y de la maquina q35 del QEMU propio (los defectos de weft)"
          LD_LIBRARY_PATH="$PWD/qemu-propio/lib" qemu-propio/bin/qemu-system-x86_64 -device help 2>&1 | grep -E -i "virtio-multitouch-pci|virtio-keyboard-pci|pcie-root-port|usb-wacom-tablet"
          LD_LIBRARY_PATH="$PWD/qemu-propio/lib" qemu-propio/bin/qemu-system-x86_64 -machine help 2>&1 | grep -E "^(q35|pc) "
        } 2>&1 | tee -a res/herramientas.txt
        # Vulkan por software para Android: weft arranca Cuttlefish sin el lanzador de Google (no hay --gpu_mode de
        # launch_cvd); con --gpu auto elige gfxstream, que ejecuta el Vulkan del invitado (ro.hardware.vulkan=ranchu) sobre
        # este lavapipe del anfitrion. El caso vulkan del banco lo usa; sin el controlador se corta aqui, con su motivo
        ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)"
        echo "GFX_ICD=$ICD" >> "$GITHUB_ENV"; echo "icd: $ICD" >> res/herramientas.txt
        if [ -z "$ICD" ]; then echo "::error title=Sin Vulkan por software::no esta lavapipe (mesa-vulkan-drivers): Android no tendria Vulkan"; exit 1; fi
        test -s arm/libheddle.so && test -s arm/banco-x86_64.apk && test -s arm/banco-arm64.apk
    - name: Primer arranque desde cero (sin herramientas de Google)
      if: always() && steps.kvm.outputs.kvm == 'si'
      env:
        # entrada del CI lanzado a mano (por el entorno, nunca expandida dentro del guion)
        WEFT_HEDDLE_REF: ${{ github.event.inputs.heddle_ref }}
      run: |
        set -o pipefail
        cargo build --release 2>&1 | tail -n 1
        mkdir -p res/primer sin-adb
        # un "adb" falso al frente del PATH: si algo lo llama (la prueba o weft), lo anota y falla; el adb propio de
        # weft (adb-shell, push, install, logcat, root, remount, disable-verity, reboot, wait-adb) no lo necesita
        printf '#!/bin/sh\necho "SE USO ADB: $*" >> "%s/res/adb-usado.txt"\nexit 99\n' "$PWD" > sin-adb/adb && chmod +x sin-adb/adb
        PATH="$PWD/sin-adb:$PATH" WEFT_BRIDGE_LIB="$PWD/arm/libheddle.so" WEFT_ARM_APK="$PWD/arm/banco-arm64.apk" WEFT_BANCO_X86="$PWD/arm/banco-x86_64.apk" WEFT_LIMIT=600 \
        WEFT_CF_FIRST=1 WEFT_CF_IMAGES="$PWD/cf" WEFT_OUT="$PWD/res/primer" \
          WEFT_QEMU_DIR="$PWD/qemu-propio" VK_ICD_FILENAMES="$GFX_ICD" VK_DRIVER_FILES="$GFX_ICD" \
          cargo test --release --test cuttlefish primer_arranque_desde_cero -- --nocapture 2>&1 | tee res/primer/transcripcion.txt
    - name: Comprobar que no se uso el adb de Google
      if: always()
      run: |
        if [ -e res/adb-usado.txt ]; then cat res/adb-usado.txt; exit 1; fi
        echo "adb de Google: no se uso (la prueba y weft usaron solo el adb propio)"
        grep -E "^QEMU: virtio-multitouch-pci|^arranco=|^adb=|^reinicio" res/primer/transcripcion.txt | head -n 8
    - name: Recortar resultados
      if: always()
      run: |
        sudo chmod -R a+rwX res
        rm -rf res/*/estado res/*/arranque
        for w in res/*/audio.wav; do [ -f "$w" ] && tail -c 3000000 "$w" > "$w.cola" && rm "$w"; done
        ls -l res res/* | head -n 60
        # los registros enormes se recortan: principio y final
        for f in res/*.txt res/*/*.txt; do
          if [ "$(stat -c %s "$f")" -gt 12000000 ]; then ( head -c 4000000 "$f"; echo; echo "[... recortado ...]"; tail -c 6000000 "$f" ) > "$f.r" && mv "$f.r" "$f"; fi
        done
    - name: Guardar resultados
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: res-cuttlefish
        path: res/
        if-no-files-found: ignore
        retention-days: 3
  bibliotecas-fedora:
    name: bibliotecas gfxstream para el QEMU de Fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Compilar rutabaga + gfxstream en Fedora 44 y probarlos con su QEMU
      shell: bash {0}
      run: |
        mkdir -p res sal
        docker run --name fed -e GFXSTREAM_REF -e RUTABAGA_REF -v "$PWD/sal:/sal" -v "$PWD:/src:ro" fedora:44 bash -c '
          dnf install -y --skip-unavailable -q qemu-system-x86 qemu-ui-gtk qemu-ui-sdl qemu-ui-dbus SDL3 freetype fontconfig qemu-audio-pipewire qemu-device-display-virtio-gpu qemu-device-display-virtio-gpu-pci unzip weston procps-ng qemu-device-display-virtio-gpu-rutabaga qemu-device-display-virtio-gpu-pci-rutabaga qemu-device-display-virtio-vga-rutabaga \
            rutabaga-gfx-ffi rutabaga-gfx-ffi-devel mesa-vulkan-drivers vulkan-loader vulkan-tools \
            git gcc gcc-c++ meson ninja-build cmake pkgconf-pkg-config cargo rust python3 diffutils \
            libdrm-devel glm-devel stb_image-devel stb_image_write-devel stb-devel vulkan-headers vulkan-loader-devel mesa-libEGL-devel mesa-libGL-devel libX11-devel libXext-devel wayland-devel libglvnd-devel 2>&1 | tail -n 5
          echo "=== versiones"; qemu-system-x86_64 --version | head -n1; rpm -q rutabaga-gfx-ffi qemu-device-display-virtio-gpu-rutabaga; rustc --version; meson --version
          echo "=== QEMU de Fedora tal cual"; timeout 10 qemu-system-x86_64 -machine pc -display none -serial none -monitor none -S -device virtio-gpu-rutabaga,gfxstream-vulkan=on,hostmem=256M 2>&1 | tail -n 3
          P=/opt/gfx; mkdir -p $P /w; cd /w
          export PKG_CONFIG_PATH=$P/lib/pkgconfig LD_LIBRARY_PATH=$P/lib
          # commits fijos (GFXSTREAM_REF y RUTABAGA_REF del env del workflow, los mismos que flatpak/plantillas/app.yml.in): git clone
          # --depth 1 no sirve para un commit concreto, asi que se baja solo ese commit con init + fetch + checkout
          clonar() { git init -q "$2" && git -C "$2" fetch -q --depth 1 "$1" "$3" && git -C "$2" checkout -q FETCH_HEAD; }
          echo "=== gfxstream $GFXSTREAM_REF"; clonar https://github.com/google/gfxstream gfxstream "$GFXSTREAM_REF" || { echo "FALLO: clonar gfxstream en $GFXSTREAM_REF"; exit 1; }; git -C gfxstream log -1 --format="gfxstream %h %cs"
          meson setup gfxstream/b gfxstream --prefix=$P --libdir=lib -Dbuildtype=release > gfx-conf.log 2>&1 || { tail -n 40 gfx-conf.log; exit 1; }
          meson install -C gfxstream/b > gfx-build.log 2>&1 || { tail -n 60 gfx-build.log; exit 1; }
          echo "=== rutabaga $RUTABAGA_REF"; clonar https://github.com/magma-gpu/rutabaga_gfx rutabaga_gfx "$RUTABAGA_REF" || { echo "FALLO: clonar rutabaga_gfx en $RUTABAGA_REF"; exit 1; }; git -C rutabaga_gfx log -1 --format="rutabaga %h %cs"
          echo "--- diferencias de la interfaz C frente a la de Fedora"; diff <(sed "s/[[:space:]]*$//" /usr/include/rutabaga_gfx/rutabaga_gfx_ffi.h) <(sed "s/[[:space:]]*$//" rutabaga_gfx/ffi/src/include/rutabaga_gfx_ffi.h) | grep -c .
          # el QEMU de Fedora se compilo con la interfaz 0.1.3, cuya estructura de inicio no tiene el campo final
          # "renderer_features": la biblioteca no debe leerlo (leeria memoria ajena)
          sed -i "s|let renderer_features_ptr = builder.renderer_features;|let renderer_features_ptr: *const c_char = std::ptr::null();|" rutabaga_gfx/ffi/src/lib.rs
          n=$(grep -c "renderer_features_ptr: \*const c_char = std::ptr::null()" rutabaga_gfx/ffi/src/lib.rs); echo "parche renderer_features: $n coincidencia(s)"
          [ "$n" = 1 ] || { echo "FALLO: el parche sed de renderer_features no quedo aplicado exactamente una vez ($n): cambio rutabaga_gfx/ffi/src/lib.rs en $RUTABAGA_REF, hay que revisar el sed de arriba"; exit 1; }
          ( cd rutabaga_gfx/ffi && cargo build --release --features gfxstream ) > rut.log 2>&1 || { tail -n 60 rut.log; exit 1; }
          SO=$(find rutabaga_gfx -name librutabaga_gfx_ffi.so -path "*release*" | head -n1); cp "$SO" $P/lib/librutabaga_gfx_ffi.so.0
          ls -l $P/lib | grep -E "\.so"; echo "nombre que pide QEMU:"; ldd /usr/lib64/qemu/hw-display-virtio-gpu-rutabaga.so 2>/dev/null | grep -i rutabaga; ls /usr/lib64/qemu | grep -i rutabaga
          echo "=== QEMU de Fedora + bibliotecas propias"
          vulkaninfo --summary 2>&1 | grep -E "deviceName" | head -n 2
          timeout 15 qemu-system-x86_64 -machine pc -display none -serial none -monitor none -S -device virtio-gpu-rutabaga,gfxstream-vulkan=on,hostmem=256M 2>&1 | grep -v "info: \[vk_\|SharedLibrary" | tail -n 12; echo "codigo=${PIPESTATUS[0]}"
          mkdir -p /sal/gfx && cp -a $P/lib/*.so* /sal/gfx/ && rm -f /sal/gfx/*.a
          # para LICENSES/ del tar.gz (tarea version): commit exacto y texto de licencia de cada biblioteca (LICENSE o LICENSE.txt)
          { git -C gfxstream log -1 --format="gfxstream %H %cs https://github.com/google/gfxstream"; git -C rutabaga_gfx log -1 --format="rutabaga_gfx %H %cs https://github.com/magma-gpu/rutabaga_gfx (con el parche de una linea de ci.yml: renderer_features_ptr = null)"; } > /sal/gfx/VERSIONES.txt
          for f in LICENSE LICENSE.txt; do [ -f gfxstream/$f ] && cp gfxstream/$f /sal/gfx/LICENSE.gfxstream; [ -f rutabaga_gfx/$f ] && cp rutabaga_gfx/$f /sal/gfx/LICENSE.rutabaga; done; cat /sal/gfx/VERSIONES.txt; ls -l /sal/gfx/LICENSE.*
          echo "=== weft doctor con QEMU de Fedora, qemu-ui-dbus, SDL3 y las bibliotecas recien compiladas (sin KVM en esta tarea: solo se guarda la salida)"
          dnf install -y -q google-noto-sans-fonts > /dev/null 2>&1 || dnf install -y -q google-noto-sans-vf-fonts > /dev/null 2>&1 || echo "AVISO: no se pudo instalar la fuente Noto Sans"; fc-match "sans-serif:lang=es"
          cp -r /src /w/src && cd /w/src && cargo build --release 2>&1 | tail -n 1
          WEFT_GFX_DIR=/sal/gfx target/release/weft doctor > /sal/doctor-bibliotecas.txt 2>&1; echo "doctor codigo=$?" >> /sal/doctor-bibliotecas.txt
          cat /sal/doctor-bibliotecas.txt
        ' > res/bibliotecas.txt 2>&1
        echo "resultado=$?" | tee -a res/bibliotecas.txt
        tail -n 30 res/bibliotecas.txt
        sudo cp sal/doctor-bibliotecas.txt res/ 2>/dev/null; sudo chown -R "$USER" res
        grep -q "Gfxstream initialized successfully" res/bibliotecas.txt || grep -q "codigo=124" res/bibliotecas.txt
        # lo que cuenta es la ultima orden: bibliotecas generadas, y un doctor que corrio (sin KVM da FALLO en esa fila, lo
        # esperado en esta tarea) viendo la pantalla D-Bus y SDL3 de los paquetes instalados
        test -f sal/gfx/librutabaga_gfx_ffi.so.0 && grep -q "^doctor codigo=" res/doctor-bibliotecas.txt && grep -q "^OK  *qemu-ui-dbus" res/doctor-bibliotecas.txt && grep -q "^OK  *SDL3" res/doctor-bibliotecas.txt
    - name: Guardar resultados
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: res-bibliotecas
        path: res/
        if-no-files-found: ignore
        retention-days: 3
    - name: Guardar las bibliotecas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gfx
        path: sal/gfx/
        retention-days: 3
  fedora-ventanas:
