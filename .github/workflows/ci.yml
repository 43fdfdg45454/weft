  flatpak:
    name: paquete Flatpak (.flatpak)
    needs: semver
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Espacio libre
      run: |
        # la construccion y los runtimes de Flathub ocupan varios GB: se libera lo que esta tarea no usa. El borrado (~100 s, son
        # muchos archivos pequenos) va en segundo plano mientras se restaura la cache y se prepara el contenedor; la construccion
        # espera a que termine (ver "Construir")
        df -h / | tail -n 1
        sudo nohup sh -c 'rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL; touch /tmp/espacio-libre' > /dev/null 2>&1 &
        mkdir -p res _flatpak-state
    - name: Cache de la construccion (fuentes y modulos ya compilados)
      uses: actions/cache@v4
      with:
        path: _flatpak-state
        # la clave lleva el run_id: con una clave fija, un acierto exacto no vuelve a guardar, asi que un estado danado restaurado
        # se reconstruia en cada pipeline sin guardar nunca el limpio. Asi cada pipeline guarda su estado bueno y el siguiente
        # restaura el mas reciente (primero uno del mismo manifiesto; si no hay, cualquiera)
        key: flatpak-${{ hashFiles('flatpak/plantillas/app.yml.in') }}-${{ github.run_id }}
        restore-keys: |
          flatpak-${{ hashFiles('flatpak/plantillas/app.yml.in') }}-
          flatpak-
    # Ubuntu 24.04 trae Flatpak 1.14, que no conoce --device=input (mandos de juegos, Flatpak >= 1.15.6) y rechaza el manifiesto:
    # todo el trabajo corre en un contenedor Fedora 44 (Flatpak 1.16 o mas nuevo), como las otras tareas de Fedora.
    - name: Construir, instalar y probar el paquete (en Fedora 44)
      shell: bash {0}
      env:
        WEFT_VERSION: ${{ needs.semver.outputs.version }}
      run: |
        docker pull -q fedora:44 > /dev/null
        T=0; while [ ! -e /tmp/espacio-libre ] && [ "$T" -lt 300 ]; do sleep 2; T=$((T + 2)); done; echo "espacio libre tras ${T} s de espera: $(df -h / | tail -n 1)"
        docker run --name fp --privileged -e WEFT_VERSION -v "$PWD:/src" fedora:44 bash -c '
          set -o pipefail
          cd /src
          dnf install -y -q flatpak flatpak-builder appstream desktop-file-utils python3-pyyaml git 2>&1 | tail -n 2
          # la cache restaurada pertenece al usuario del runner: git (en el estado de flatpak-builder) la rechaza por dueno ajeno ("origin" no existe)
          chown -R 0:0 /src/_flatpak-state 2>/dev/null; git config --global --add safe.directory "*"
          flatpak --version; flatpak-builder --version
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          df -h / | tail -n 1
          echo "=== generar y validar manifiesto, .desktop y metainfo"
          ok=1
          SOLO_GENERAR=1 bash flatpak/construir.sh && python3 -c "import sys,yaml; m=yaml.safe_load(open(sys.argv[1])); print(\"manifiesto ok:\", m[\"app-id\"], len(m[\"modules\"]), \"modulos\"); assert \"--share=network\" in m[\"finish-args\"], \"el paquete debe pedir red (internet de Android y adb por TCP entre instancias)\"" flatpak/generado/*.yml && desktop-file-validate flatpak/generado/*.desktop && appstreamcli validate --no-net flatpak/generado/*.metainfo.xml || ok=0
          echo "generar_validar=$ok"
          echo "=== construir (QEMU, rutabaga, gfxstream, virtiofsd y weft)"
          T0=$(date +%s)
          FLATPAK_BUILDER_EXTRA="--disable-rofiles-fuse" bash flatpak/construir.sh /src/weft.flatpak; rc=$?
          if [ "$rc" != 0 ]; then
            # un estado restaurado de la cache puede estar danado: se reintenta una vez desde cero (el registro del primer intento queda arriba)
            echo "=== primer intento fallido (codigo $rc): se reintenta con el estado vacio"
            rm -rf /src/_flatpak-state /src/_flatpak-build /src/_flatpak-repo
            FLATPAK_BUILDER_EXTRA="--disable-rofiles-fuse" bash flatpak/construir.sh /src/weft.flatpak; rc=$?
          fi
          echo "construccion_codigo=$rc segundos=$(( $(date +%s) - T0 ))"
          ls -l /src/weft.flatpak 2>&1; sha256sum /src/weft.flatpak 2>&1
          [ "$rc" = 0 ] && [ "$ok" = 1 ] && [ -s /src/weft.flatpak ] || { echo "RESULTADO=FALLO (construccion)"; chown -R $(stat -c %u:%g /src) /src 2>/dev/null; exit 1; }
          echo "=== instalar el paquete"
          flatpak install --user -y --noninteractive --bundle /src/weft.flatpak 2>&1 | tail -n 5
          ID=$(sed -n "s/^APP_ID=\"\${APP_ID:-\(.*\)}\"\$/\1/p" flatpak/construir.sh)
          F=$(flatpak info --user --show-location $ID)/files
          echo "id=$ID ubicacion=$F"
          echo "--- contenido del paquete (sin sandbox)"
          # la salida real del paquete instalado va a res/contenido-flatpak.txt y el test final mira ahi (res/flatpak.txt lleva tambien el
          # registro de flatpak-builder con las ordenes install de esos mismos nombres, asi que un grep ahi pasaba siempre)
          { ls $F/qemu/lib | grep -E "rutabaga|gfxstream"; ls -l $F/libexec/virtiofsd $F/bin/weft $F/bin/weft-launch; ls $F/qemu/lib/qemu 2>/dev/null | grep -E "rutabaga|dbus" | head; } 2>&1 | tee /src/res/contenido-flatpak.txt
          echo "--- permisos que pide el paquete"
          flatpak info --user --show-permissions $ID
          echo "--- en el sandbox (si el contenedor permite lanzar Flatpak)"
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p -m 700 $XDG_RUNTIME_DIR
          flatpak run --command=sh $ID -c "/app/qemu/bin/qemu-system-x86_64 --version | head -n1; /app/qemu/bin/qemu-system-x86_64 -device help 2>&1 | grep -i rutabaga; /app/qemu/bin/qemu-system-x86_64 -display help 2>&1 | grep -x dbus; ls /app/qemu/lib | grep -E \"rutabaga|gfxstream\"; ls /app/libexec/virtiofsd" > /src/res/sandbox-qemu.txt 2>&1; echo "sandbox_codigo=$?"
          cat /src/res/sandbox-qemu.txt
          flatpak run --command=weft $ID doctor > /src/res/doctor-flatpak.txt 2>&1; echo "doctor_codigo=$?"; cat /src/res/doctor-flatpak.txt
          echo "--- launch sin ninguna imagen instalada (lo que hace el icono del menu): debe terminar con 1 y explicar como agregar una"
          timeout 60 flatpak run --command=weft $ID launch > /src/res/launch-flatpak.txt 2>&1; echo "launch_codigo=$?"; cat /src/res/launch-flatpak.txt
          flatpak run --command=weft $ID paths > /src/res/paths-flatpak.txt 2>&1; cat /src/res/paths-flatpak.txt
          chown -R $(stat -c %u:%g /src) /src 2>/dev/null
          echo "RESULTADO=OK"
        ' 2>&1 | tee res/flatpak.txt
        r=${PIPESTATUS[0]}
        echo "contenedor_codigo=$r" | tee -a res/flatpak.txt
        # la prueba que cuenta: construyo, se instalo, el contenido REAL del paquete instalado (res/contenido-flatpak.txt, no el registro de
        # la construccion, y sin errores de ls) trae rutabaga, gfxstream, virtiofsd, weft y el envoltorio weft-launch, y weft doctor corrio (doctor_codigo). Si el contenedor deja lanzar Flatpak
        # (sandbox_codigo=0), ademas: el QEMU del sandbox trae el dispositivo de GPU y la pantalla D-Bus (res/sandbox-qemu.txt), doctor ve
        # ese QEMU (fila qemu-system-x86_64 en OK) y launch sin imagen termina con 1 diciendo que no hay ninguna imagen
        test "$r" = 0 && grep -q "^RESULTADO=OK" res/flatpak.txt && test -s weft.flatpak \
          && ! grep -q "cannot access" res/contenido-flatpak.txt && grep -q "librutabaga_gfx_ffi" res/contenido-flatpak.txt && grep -q "libgfxstream_backend" res/contenido-flatpak.txt && grep -qE "^-r.* [^ ]*/libexec/virtiofsd$" res/contenido-flatpak.txt \
          && grep -q "^doctor_codigo=" res/flatpak.txt \
          && { ! grep -q "^sandbox_codigo=0" res/flatpak.txt || { grep -qi "virtio-gpu-rutabaga" res/sandbox-qemu.txt && grep -qx "dbus" res/sandbox-qemu.txt && grep -q "^OK  *qemu-system-x86_64" res/doctor-flatpak.txt && grep -q "^launch_codigo=1" res/flatpak.txt && grep -q "ninguna imagen" res/launch-flatpak.txt; }; }
    - name: Resumen legible sin sesion de GitHub
      if: always()
      shell: bash {0}
      run: |
        {
          echo "### paquete Flatpak"
          echo '```'
          grep -E "^(flatpak|Flatpak|=== |generar_validar|construccion_codigo|RESULTADO|sandbox_codigo|doctor_codigo|launch_codigo|contenedor_codigo|id=|-rw|manifiesto ok)" res/flatpak.txt | head -n 60
          echo "--- ultimas 120 lineas"
          tail -n 120 res/flatpak.txt | cut -c1-300
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Guardar resultados
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: res-flatpak
        path: res/
        if-no-files-found: ignore
        retention-days: 3
    - name: Guardar el paquete
      uses: actions/upload-artifact@v4
      with:
        name: flatpak
        path: weft.flatpak
        retention-days: 3
  # resultados: SIEMPRE corre (aunque otras tareas fallen; no si se cancelo el pipeline) y deja en el release "ci" el resumen legible sin sesion de GitHub, los registros
  # de cada tarea (resultados.tar.gz) y las ultimas lineas de lo que suele fallar. No construye ni publica ninguna version.
  resultados:
    name: resultados del pipeline
    # un pipeline cancelado a medias no debe borrar ni recrear el release ci del anterior
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
    needs:
    - semver
    - base
    - qemu-ubuntu
    - cuttlefish
    - bibliotecas-fedora
    - fedora-ventanas
    - fedora-raton
    - fedora-cow-rsa
    - fedora-ventana-propia
    - flatpak
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        path: art
    - name: Publicar resultados de todas las tareas
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p todo art
        for d in art/res-*; do if [ -d "$d" ]; then cp -r "$d" "todo/${d#art/res-}"; fi; done
        {
          echo "commit=${{ github.sha }}"
          echo "base=${{ needs.base.result }}"
          echo "qemu_ubuntu=${{ needs.qemu-ubuntu.result }}"
          echo "cuttlefish=${{ needs.cuttlefish.result }}"
          echo "bibliotecas=${{ needs.bibliotecas-fedora.result }}"
          echo "ventanas=${{ needs.fedora-ventanas.result }}"
          echo "raton=${{ needs.fedora-raton.result }}"
          echo "cow_rsa=${{ needs.fedora-cow-rsa.result }}"
          echo "ventana_propia=${{ needs.fedora-ventana-propia.result }}"
          echo "flatpak=${{ needs.flatpak.result }}"
          # "no": el ejecutor no tenia KVM y las pruebas que lo necesitan se omitieron (ver los avisos del pipeline)
          echo "kvm=base:${{ needs.base.outputs.kvm }} cuttlefish:${{ needs.cuttlefish.outputs.kvm }} ventanas:${{ needs.fedora-ventanas.outputs.kvm }} raton:${{ needs.fedora-raton.outputs.kvm }} cow_rsa:${{ needs.fedora-cow-rsa.outputs.kvm }} ventana_propia:${{ needs.fedora-ventana-propia.outputs.kvm }}"
        } | tee todo/resumen.txt
        {
          echo "Resumen del pipeline de ${{ github.sha }}:"; echo; echo '```'; cat todo/resumen.txt; echo '```'
          for f in todo/flatpak/flatpak.txt todo/ventana-propia/ventana-propia.txt; do
            if [ -f "$f" ]; then echo; echo "Final de $f:"; echo '```'; tail -n 70 "$f" | cut -c1-240; echo '```'; fi
          done
          for f in todo/*/verificaciones.txt; do if [ -f "$f" ]; then echo; echo "$f:"; echo '```'; cat "$f"; echo '```'; fi; done
        } > notas.md
        head -c 120000 notas.md > notas-corto.md
        tar -czf resultados.tar.gz -C todo .
        gh release delete ci --yes --cleanup-tag 2>/dev/null || true
        gh release create ci resultados.tar.gz todo/resumen.txt --prerelease --latest=false --title "Resultados del ultimo pipeline" --notes-file notas-corto.md

  # version: solo si TODAS las tareas pasaron con KVM (y es un push). Publica vX.Y.Z (la de semver) con el programa, las bibliotecas de gfxstream y el paquete Flatpak.
  version:
    name: version
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && needs.semver.result == 'success' && needs.base.result == 'success' && needs.qemu-ubuntu.result == 'success' && needs.cuttlefish.result == 'success' && needs.bibliotecas-fedora.result == 'success' && needs.fedora-ventanas.result == 'success' && needs.fedora-raton.result == 'success' && needs.fedora-cow-rsa.result == 'success' && needs.fedora-ventana-propia.result == 'success' && needs.flatpak.result == 'success' && needs.base.outputs.kvm == 'si' && needs.cuttlefish.outputs.kvm == 'si' && needs.fedora-ventanas.outputs.kvm == 'si' && needs.fedora-raton.outputs.kvm == 'si' && needs.fedora-cow-rsa.outputs.kvm == 'si' && needs.fedora-ventana-propia.outputs.kvm == 'si' }}
    needs:
    - semver
    - base
    - qemu-ubuntu
    - cuttlefish
    - bibliotecas-fedora
    - fedora-ventanas
    - fedora-raton
    - fedora-cow-rsa
    - fedora-ventana-propia
    - flatpak
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: art
    - name: Publicar version
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.semver.outputs.version }}
      run: |
        # VERSION: la que calculo semver con GitVersion y va incrustada en el binario y en el .flatpak. Si la etiqueta ya
        # existe, no se publica.
        TAG="v$VERSION"; echo "Version: $TAG"
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::version no valida para publicar: '$VERSION'"; exit 1; fi
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "::error::la etiqueta $TAG ya existe"; exit 1; fi
        # el paquete incluye las bibliotecas de gfxstream para el QEMU de Fedora (gfx/), que weft usa solo
        mkdir -p paquete/weft/gfx && cp art/binario/weft paquete/weft/ && chmod +x paquete/weft/weft && cp -r perfiles scripts paquete/weft/
        cp -a art/gfx/. paquete/weft/gfx/ && test -f paquete/weft/gfx/librutabaga_gfx_ffi.so.0
        # (los artefactos no conservan enlaces simbolicos: se recrea el nombre que busca el cargador)
        ( cd paquete/weft/gfx && for f in libgfxstream_backend.so.0.*; do ln -sf "$f" libgfxstream_backend.so.0; done; ls -l )
        # LICENSES/: la licencia de weft (MIT), las de las dos bibliotecas de gfx/ con sus commits (lo guardo bibliotecas-fedora junto a
        # los .so; si faltan, mv falla y no se publica) y un THIRD-PARTY.md que dice que es cada cosa
        mkdir -p paquete/weft/LICENSES && cp LICENSE paquete/weft/LICENSES/LICENSE.weft
        mv paquete/weft/gfx/LICENSE.gfxstream paquete/weft/gfx/LICENSE.rutabaga paquete/weft/gfx/VERSIONES.txt paquete/weft/LICENSES/
        cat > paquete/weft/LICENSES/THIRD-PARTY.md <<'EOF'
        # Software de terceros en weft-linux-x86_64.tar.gz

        weft (el ejecutable `weft`, `perfiles/` y `scripts/`) es software libre bajo la licencia MIT: ver `LICENSE.weft`.

        La carpeta `gfx/` contiene dos bibliotecas de terceros, compiladas por la tarea `bibliotecas-fedora` del pipeline de CI
        (`.github/workflows/ci.yml`) a partir de un commit fijo de cada repositorio, el mismo que compila el paquete Flatpak (hashes
        exactos en `VERSIONES.txt`, también al final de este archivo):

        - `librutabaga_gfx_ffi.so.0`: rutabaga_gfx, https://github.com/magma-gpu/rutabaga_gfx, licencia BSD-3-Clause (texto en
          `LICENSE.rutabaga`). Lleva UN parche de una línea en `ffi/src/lib.rs`, aplicado con sed antes de compilar, para que la
          biblioteca no lea el campo final `renderer_features` de la estructura de inicio (el QEMU de Fedora se compiló contra la
          interfaz 0.1.3, que no tiene ese campo):

              sed -i "s|let renderer_features_ptr = builder.renderer_features;|let renderer_features_ptr: *const c_char = std::ptr::null();|" rutabaga_gfx/ffi/src/lib.rs

        - `libgfxstream_backend.so.0` (y su versión completa): gfxstream, https://github.com/google/gfxstream, licencia Apache-2.0
          (texto en `LICENSE.gfxstream`), sin parches.

        El código fuente de ambas está en los repositorios indicados, en estos commits:
        EOF
        { echo; echo '```'; cat paquete/weft/LICENSES/VERSIONES.txt; echo '```'; } >> paquete/weft/LICENSES/THIRD-PARTY.md
        ls -l paquete/weft/LICENSES
        tar -C paquete -czf weft-linux-x86_64.tar.gz weft
        # el paquete Flatpak (con QEMU, rutabaga, gfxstream y virtiofsd dentro) se publica junto al tar.gz
        cp art/flatpak/weft.flatpak weft-linux-x86_64.flatpak && test -s weft-linux-x86_64.flatpak
        gh release create "$TAG" weft-linux-x86_64.tar.gz weft-linux-x86_64.flatpak --target "${{ github.sha }}" --title "weft $TAG" --notes "Compilacion automatica de ${{ github.sha }}. weft-linux-x86_64.tar.gz: el programa weft con sus perfiles, el guion de desarrollo y las bibliotecas de aceleracion grafica (gfx/). weft-linux-x86_64.flatpak: el mismo programa con QEMU, rutabaga, gfxstream y virtiofsd dentro. No validado en hardware Android/ARM real. Incluye software de terceros: ver LICENSES/ y THIRD-PARTY.md en el tar.gz (y /app/share/licenses/ en el .flatpak); el .flatpak contiene QEMU 10.2.2 (GPL-2.0), fuentes en https://download.qemu.org/qemu-10.2.2.tar.xz."
