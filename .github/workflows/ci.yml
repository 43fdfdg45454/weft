        mkdir -p res sal
        docker run --name fed --privileged -v "$PWD/sal:/sal" -v "$PWD:/src:ro" -v "$PWD/gfx:/gfx:ro" fedora:44 bash -c '
          dnf install -y --skip-unavailable -q qemu-system-x86 qemu-ui-gtk qemu-ui-sdl qemu-ui-dbus qemu-ui-opengl SDL3 freetype fontconfig qemu-audio-pipewire qemu-device-display-virtio-gpu qemu-device-display-virtio-gpu-pci qemu-device-display-virtio-gpu-rutabaga qemu-device-display-virtio-gpu-pci-rutabaga qemu-device-display-virtio-vga-rutabaga rutabaga-gfx-ffi mesa-vulkan-drivers vulkan-loader mesa-libEGL mesa-libGL mesa-dri-drivers unzip weston procps-ng cargo rust 2>&1 | tail -n 3
          dnf install -y -q google-noto-sans-fonts > /dev/null 2>&1 || dnf install -y -q google-noto-sans-vf-fonts > /dev/null 2>&1 || echo "AVISO: no se pudo instalar la fuente Noto Sans"; fc-match "sans-serif:lang=es"
          qemu-system-x86_64 --version | head -n1; mkdir -p /w; ls -l /gfx
          echo "=== paquete weft como el publicado"
          cp -r /src /w/src && cd /w/src && cargo build --release 2>&1 | tail -n 1
